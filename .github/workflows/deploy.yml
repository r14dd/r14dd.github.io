name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The artifact flow (upload-pages-artifact → deploy-pages) publishes
# atomically: a green run means the site IS live. The previous gh-pages
# branch + legacy Pages build could succeed while the publish step silently
# never fired, leaving a stale site behind a green checkmark.
#
# PRs run the same build/lint/test gate but never touch Pages (see the
# per-step/job `if:` below). Scoping the group by ref keeps PR runs from
# ever colliding with a main push's group, so a PR can't cancel a deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # The resume PDF is rendered from the profile data on every build.
      - name: Install tectonic
        run: |
          curl -fsSL -o tectonic.tar.gz "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  tectonic.tar.gz" | sha256sum -c -
          tar xzf tectonic.tar.gz
          sudo mv tectonic /usr/local/bin/

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check

      # Needed before the build itself: prebuild renders the OG share cards
      # with Playwright chromium, and the e2e suite below reuses the same
      # browser against the built dist via `astro preview`.
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      # Gates the artifact upload: a red test never reaches Pages.
      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
