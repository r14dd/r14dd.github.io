name = "toy-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# ADMIN_KEY is provided via `wrangler secret put ADMIN_KEY` in production.

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "VisitorCounter"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "SongRelay"

[[durable_objects.bindings]]
name = "MESSAGES"
class_name = "MessageBox"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "PhoneRoom"

# The free plan requires every Durable Object namespace to be SQLite-backed.
# VisitorCounter and SongRelay still use the KV storage API, which SQLite-backed
# DOs support; only MessageBox touches state.storage.sql directly.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitorCounter", "SongRelay", "MessageBox", "PhoneRoom"]
