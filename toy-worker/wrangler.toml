name = "toy-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# ADMIN_KEY is provided via `wrangler secret put ADMIN_KEY` in production.

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "VisitorCounter"

[[durable_objects.bindings]]
name = "MESSAGES"
class_name = "MessageBox"

# The free plan requires every Durable Object namespace to be SQLite-backed.
# VisitorCounter still uses the KV storage API, which SQLite-backed DOs support;
# only MessageBox touches state.storage.sql directly.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitorCounter", "SongRelay", "MessageBox", "PhoneRoom"]

# The song relay and phone trick were cut. Migration tags are append-only, so v1
# stays as it was written and the namespaces are torn down here instead.
[[migrations]]
tag = "v2"
deleted_classes = ["SongRelay", "PhoneRoom"]
